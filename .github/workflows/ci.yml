name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze src and scripts (any Warning or Error fails the job)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Scope CurrentUser -Force -SkipPublisherCheck
          $findings = foreach ($p in 'src', 'scripts') {
            Invoke-ScriptAnalyzer -Path $p -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 250
          if (@($findings).Count -gt 0) { throw "$(@($findings).Count) PSScriptAnalyzer finding(s)." }

  test:
    name: Pester
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester 5
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Normal'
          $c.TestResult.Enabled = $true
          $c.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pester-results
          path: pester-results.xml

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links and anchors in Markdown (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --exclude-path tools --exclude-path .ai --exclude-path .claude --exclude-path docs/node_modules './**/*.md'
          fail: true

  docs:
    name: VitePress build (dead links fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build docs
        run: |
          cd docs
          npm install --no-audit --no-fund
          npm run docs:build
